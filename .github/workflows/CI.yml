name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_suite:
        description: 'Run the full release suite (A79); ordinary CI uses focused owners'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    name: ${{ matrix.suite }} (${{ matrix.platform.os }}, ${{ matrix.platform.threads }})
    strategy:
      fail-fast: false
      matrix:
        suite: [core, ingestion, invariants]
        platform:
          - os: ubuntu-latest
            threads: '1'
          - os: ubuntu-latest
            threads: '4'
          - os: macos-latest
            threads: '1'
          - os: windows-latest
            threads: '1'
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      JULIA_NUM_THREADS: ${{ matrix.platform.threads }}
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Instantiate and record environment
        run: julia --startup-file=no --project=. -e 'using Pkg, InteractiveUtils; Pkg.instantiate(); versioninfo(); Pkg.status()'
      - name: Package, API, and maintained runner contracts
        if: matrix.suite == 'core'
        run: julia --startup-file=no --project=. test/runtests.jl --file=test_contracts.jl --file=test_test_runner.jl
      - name: Field-aware linear algebra
        if: matrix.suite == 'core'
        run: julia --startup-file=no --project=. test/runtests.jl --file=test_field_linalg.jl --fields=QQ,F2,F3,F5,Real64
      - name: Minimal optional boundaries and ordinary persistence
        if: matrix.suite == 'core'
        env:
          JULIA_LOAD_PATH: ${{ runner.os == 'Windows' && '@;@stdlib' || '@:@stdlib' }}
          TAMEROP_TEST_MINIMAL: 'true'
        run: julia --startup-file=no --project=. test/runtests.jl --file=test_ordinary_persistence.jl --file=test_extensions.jl --file=test_visualization.jl --file=test_featurizers.jl --prefix=A16 --prefix=A21
      - name: Ingestion owner
        if: matrix.suite == 'ingestion'
        run: julia --startup-file=no --project=. test/runtests.jl --file=test_data_pipeline.jl --fields=QQ,F2,F3,F5,Real64
      - name: Kan cache ownership across fields
        if: matrix.suite == 'core'
        run: julia --startup-file=no --project=. test/runtests.jl --file=test_encoding.jl --prefix='A16 Kan maps respect module-owned caches on equal posets' --fields=QQ,F2,F3,F5,Real64
      - name: Invariants owner
        if: matrix.suite == 'invariants'
        run: julia --startup-file=no --project=. test/runtests.jl --file=test_invariants.jl --fields=QQ,F2,F3,F5,Real64
      - name: Native indecomposable decomposition
        if: matrix.suite == 'core'
        run: julia --startup-file=no --project=. test/runtests.jl --file=test_indecomposable_decompositions.jl
      - name: Behavioral option contracts across owners
        if: matrix.suite == 'core'
        run: julia --startup-file=no --project=. test/runtests.jl --file=test_zn_backend.jl --file=test_pl_backend.jl --file=test_derived_functors.jl --file=test_poset_interface.jl --prefix=A14 --fields=QQ,F2,F3,F5,Real64
      - name: Public onboarding contracts
        if: matrix.suite == 'core'
        run: julia --startup-file=no --project=. test/runtests.jl --file=test_examples.jl --prefix="Package onboarding"
      - name: Explicitly requested full release suite
        if: matrix.suite == 'core' && github.event_name == 'workflow_dispatch' && inputs.full_suite
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.test()'

  extensions:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      JULIA_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Test target and required Tables extension
        run: >-
          julia --startup-file=no --project=. -e 'using Pkg;
          Pkg.test(test_args=["--file=test_extensions.jl", "--file=test_featurizers.jl",
          "--prefix=A17", "--prefix=Tables column interfaces", "--prefix=A64",
          "--require-extension=TamerOpTablesExt"])'
      - name: All declared extensions in an isolated environment
        run: |
          julia --startup-file=no --project=. -e '
            using Pkg, TOML
            root = pwd()
            project = TOML.parsefile(joinpath(root, "Project.toml"))
            mktempdir() do environment
              open(joinpath(environment, "Project.toml"), "w") do io
                TOML.print(io, Dict("deps" => merge(project["deps"], project["weakdeps"],
                  project["extras"]), "compat" => project["compat"]))
              end
              Pkg.activate(environment)
              Pkg.develop(path=root)
              Pkg.instantiate()
              Pkg.status()
              append!(ARGS, ["--file=test_extensions.jl", "--file=test_featurizers.jl", "--file=test_visualization.jl", "--file=test_ordinary_persistence.jl", "--file=test_examples.jl", "--file=test_indecomposable_decompositions.jl"])
              append!(ARGS, ["--require-extension=" * name for name in sort!(collect(keys(project["extensions"])))])
              include(joinpath(root, "test", "runtests.jl"))
            end'
