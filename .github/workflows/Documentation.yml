name: Documentation

on:
  push:
    paths: ['docs/**', 'src/**', 'ext/**', 'Project.toml', '.github/workflows/Documentation.yml']
  pull_request:
    paths: ['docs/**', 'src/**', 'ext/**', 'Project.toml', '.github/workflows/Documentation.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JULIA_NUM_THREADS: '1'
      JULIA_NUM_PRECOMPILE_TASKS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: python -m pip install -r docs/requirements.txt
      - run: julia --startup-file=no --threads=1 --project=docs -e 'using Pkg; Pkg.instantiate()'
      - run: python -m unittest discover -s docs/build_scripts -p 'test_*.py'
      - run: python docs/build_scripts/publish.py
      - run: python docs/build_scripts/check_site.py
      - uses: actions/upload-artifact@v4
        with:
          name: teaching-site
          path: docs/build
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: notebook-failure
          path: docs/.build/*-failed.ipynb
          if-no-files-found: ignore
