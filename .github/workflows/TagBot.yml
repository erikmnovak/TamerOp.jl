name: TagBot

on:
  issue_comment:
    types:
      - created
  workflow_dispatch:

# TagBot follows registration in General; running it does not register a package.
# Use repository default permissions as recommended by upstream TagBot.
# Configuration and release verification: docs/releasing.md.
jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest

    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Enable only after configuring a write-enabled deploy key, e.g. when
          # tags need to trigger a documentation workflow. See docs/releasing.md.
          # ssh: ${{ secrets.DOCUMENTER_KEY }}
