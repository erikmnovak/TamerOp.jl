name: TagBot

on:
  issue_comment:
    types:
      - created
  workflow_dispatch:

# TagBot follows registration in General; running it does not register a package.
# Configuration and release verification: RELEASING.md in this repository.
jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    # Repository defaults are read-only; grant release access to this job.
    permissions:
      contents: write # Create tags and releases.
      issues: write # Read release notes and report failed releases.
      pull-requests: read # Build the changelog.

    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
