name: Visualization

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JULIA_NUM_THREADS: '1'
  JULIA_NUM_PRECOMPILE_TASKS: '1'
  OPENBLAS_NUM_THREADS: '1'
  TAMEROP_COMPOSITION_HTML: ${{ github.workspace }}/test/browser/artifacts/composition.html
  TAMEROP_PORTABLE_SESSION_OUTPUT: ${{ github.workspace }}/test/browser/artifacts/session.html
  TAMEROP_PORTABLE_SESSION: ${{ github.workspace }}/test/browser/artifacts/session.html
  TAMEROP_STATIC_HTML: ${{ github.workspace }}/test/browser/artifacts/static.html
  TAMEROP_SOURCE_PREVIEW_HTML: ${{ github.workspace }}/test/browser/artifacts/source-preview.html
  TAMEROP_BATCHED_HTML: ${{ github.workspace }}/test/browser/artifacts/batched.html
  TAMEROP_A97_HTML: ${{ github.workspace }}/test/browser/artifacts/coordinates.html
  TAMEROP_A55_HTML: ${{ github.workspace }}/test/browser/artifacts/temporal.html
  TAMEROP_A40_HTML: ${{ github.workspace }}/test/browser/artifacts/slice-classes.html
  TAMEROP_REDUCTION_HTML: ${{ github.workspace }}/test/browser/artifacts/reduction.html
  TAMEROP_END_CURVES_HTML: ${{ github.workspace }}/test/browser/artifacts/end-curves.html
  TAMEROP_STABILITY_HTML: ${{ github.workspace }}/test/browser/artifacts/stability.html
  TAMEROP_GRAPHCODE_HTML: ${{ github.workspace }}/test/browser/artifacts/graphcode.html
  TAMEROP_GRAPHCODE_QQ_HTML: ${{ github.workspace }}/test/browser/artifacts/graphcode-qq.html
  TAMEROP_CLUSTERING_HTML: ${{ github.workspace }}/test/browser/artifacts/clustering.html
  TAMEROP_SOURCE_LAB_HTML: ${{ github.workspace }}/test/browser/artifacts/source-laboratory.html
  TAMEROP_PATH_HTML: ${{ github.workspace }}/test/browser/artifacts/path.html
  TAMEROP_RELATIVE_HTML: ${{ github.workspace }}/test/browser/artifacts/relative.html
  TAMEROP_ATLAS_HTML: ${{ github.workspace }}/test/browser/artifacts/atlas.html
  TAMEROP_A87_HTML: ${{ github.workspace }}/test/browser/artifacts/summands.html

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Support matrix and source ownership
        run: |
          python test/visualization_contracts.py
          python -m unittest discover -s test -p 'test_visualization_contracts.py'
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Prepare required graphics dependencies
        run: julia --startup-file=no --project=test/browser -e 'using Pkg; Pkg.develop(path=pwd()); Pkg.instantiate(); Pkg.precompile()'
      - name: Mathematical and native renderer contracts for every visual family
        run: python test/visualization_contracts.py --run-native
      - name: Preserve exports for the offline browser checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visualization-native
          path: test/browser/artifacts
          if-no-files-found: error
          retention-days: 7

  live-browser:
    name: Live browser (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      TAMEROP_BROWSER_OUTPUT: ${{ github.workspace }}/test/browser/test-results/live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: test/browser/package-lock.json
      - name: Prepare sandboxed Chromium
        working-directory: test/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
          bash setup-ci-sandbox.sh
          node check-sandbox.mjs
      - name: Verify complete browser selection and acceptance guards
        working-directory: test/browser
        run: |
          node --test acceptance-guard.test.mjs
          npm run test:plan
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Prepare required graphics dependencies
        run: julia --startup-file=no --project=test/browser -e 'using Pkg; Pkg.develop(path=pwd()); Pkg.instantiate(); Pkg.precompile()'
      - name: Real browser controls, coordinates and lifecycle
        working-directory: test/browser
        run: npm test -- --shard=${{ matrix.shard }}/2
      - name: Preserve browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visualization-live-${{ matrix.shard }}
          path: |
            test/browser/test-results
            test/browser/playwright-report
          retention-days: 7

  offline-browser:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAMEROP_BROWSER_OUTPUT: ${{ github.workspace }}/test/browser/test-results/offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: test/browser/package-lock.json
      - name: Prepare sandboxed Chromium
        working-directory: test/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
          bash setup-ci-sandbox.sh
          node check-sandbox.mjs
      - uses: actions/download-artifact@v4
        with:
          name: visualization-native
          path: test/browser/artifacts
      - name: Reopen exports without a Julia server
        working-directory: test/browser
        run: npm run test:offline
      - name: Preserve offline browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visualization-offline
          path: test/browser/test-results
          retention-days: 7

  acceptance:
    if: always()
    needs: [native, live-browser, offline-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every visualization lane
        env:
          NATIVE_RESULT: ${{ needs.native.result }}
          LIVE_RESULT: ${{ needs.live-browser.result }}
          OFFLINE_RESULT: ${{ needs.offline-browser.result }}
        run: |
          test "$NATIVE_RESULT" = success
          test "$LIVE_RESULT" = success
          test "$OFFLINE_RESULT" = success
