# Documentation intent, not a second list of all public symbols.
# Runtime bindings and object identities come from api_inventory.toml.
# Planned reference paths may be absent while reference_status = "backlog".
schema_version = 1
inventory = "docs/api_inventory.toml"

[policy]
routing = "override_then_canonical_owner_then_declaration_owner"
owner_assignment_status = "provisional_until_method_family_review"
docstring_presence_is_reference_completion = false
owner_candidates_are_automatically_public = false
remaining_owner_candidates = "review_backlog"
publication_gate = "first_path_complete; other_families_may_remain_backlog"

[first_path]
plan = "docs/learning_path.md"
reference_status = "backlog"
review_status = "mathematical_oracle_available; prose_and_reader_review_pending"
reference_pages = ["docs/src/reference/first_learning_path.md"]
example_sources = ["docs/build_scripts/check_first_encoding.jl"]
rendering_status = "recipe_selection_and_execution_pending"
bindings = [
  "TamerOp.cubical_persistence", "TamerOp.PersistenceDiagram",
  "TamerOp.finite_intervals", "TamerOp.essential_births",
  "TamerOp.describe", "TamerOp.provenance",
  "TamerOp.encode", "TamerOp.EncodingResult", "TamerOp.QQ",
  "TamerOp.CoreModules.QQField", "TamerOp.CoreModules.F2",
  "TamerOp.Advanced.BoxUpset", "TamerOp.Advanced.BoxDownset",
  "TamerOp.Advanced.EncodingOptions", "TamerOp.encoding_poset",
  "TamerOp.encoding_map", "TamerOp.dimensions", "TamerOp.encoding_module",
  "TamerOp.Advanced.nvertices", "TamerOp.Advanced.locate",
  "TamerOp.Advanced.leq", "TamerOp.Advanced.dim_at",
  "TamerOp.Advanced.structure_map", "TamerOp.Advanced.check_module",
  "TamerOp.available_visuals", "TamerOp.visualize", "TamerOp.save_visual",
]

[[families]]
id = "inputs"
title = "Inputs, filtrations, construction options, budgets, and registries"
question = "How do my data and a chosen filtration define the input module?"
owners = ["TamerOp.DataTypes", "TamerOp.DataIngestion", "TamerOp.SyntheticData"]
reference_pages = ["docs/src/reference/inputs.md"]
guides = ["docs/ingestion_options.md", "docs/multicover.md", "docs/rhomboid_depth.md", "docs/option_contracts.md"]
example_sources = []
example_status = "verified_end_to_end_tutorial_needed"
reference_status = "backlog"
review_status = "owner_routing_only; method_families_pending"
backlog = ["Distinguish raw data, filtered complexes, and completed encodings", "Explain grade orientation, axes, truncation, budgets, and extension requirements", "Choose one data route that joins the first inspection lesson"]

[[families]]
id = "modules"
title = "Finite posets, modules, morphisms, indicators, fringes, and flanges"
question = "What spaces and maps does this finite mathematical object contain?"
owners = ["TamerOp.FiniteFringe", "TamerOp.Modules", "TamerOp.AbelianCategories", "TamerOp.IndicatorTypes", "TamerOp.FlangeZn"]
reference_pages = ["docs/src/reference/modules.md"]
guides = ["docs/persistence_modules.md", "docs/finite_encodings.md", "docs/indicator_presentations.md", "docs/tameness.md", "docs/math_categories.md"]
example_sources = ["docs/build_scripts/check_first_encoding.jl", "docs/build_scripts/check_indicator_presentations.jl"]
example_status = "square_and_overlapping_summands_oracles; general_module_tutorial_needed"
reference_status = "backlog"
review_status = "first_path_subset_selected; method_families_pending"
backlog = ["Write the square's indicator constructors and space/map queries first", "Later cover morphisms, kernels, images, and direct sums with nontrivial matrices", "Separate finite-poset modules from ambient presentations"]

[[families]]
id = "encodings"
