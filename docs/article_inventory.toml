[[articles]]
id = "generalized_rank_lesson"
title = "Classes that persist across a region"
type = "lesson"
topics = ["invariants", "algebra", "features"]
question = "What does generalized rank detect beyond pairwise ranks, and how does expanding a region produce a landscape?"
state = "planned"
planned_source = "docs/tutorials/generalized_rank.ipynb"
scope = "Begin with parallel versus transverse maps from two lines to a plane, with the same dimensions and pairwise ranks. Motivate compatibility, limit, colimit and the one-anchor comparison without requiring derived algebra. Explain convexity and connectedness, finite labels versus an ambient restriction, a negative signed coefficient, and finite-family reconstruction versus decomposition. Introduce continuous worms and the GRIL supremum through a rectangle and a quadrant; interpret rank level and worm length, boundary attainment and exact versus sampled widths. Figures should pair both fork modules with their images, show signed overlap correction, and follow an expanding continuous worm with its rank staircase and resulting width. Conclude with what fixed probes retain and lose. Learned selection and differentiable training belong to a future optional topic."
plan_ids = ["A54", "B54"]
related = ["slices_invariants", "diamond_maps", "universal_constructions", "signed_summaries", "features_lesson", "guide_generalized_rank", "B54"]
migration = "author"

[[articles]]
id = "guide_generalized_rank"
title = "Querying regions and building GRIL features"
type = "library_guide"
topics = ["invariants", "encodings", "features"]
question = "When should I query finite-label generalized rank, a signed interval family, or continuous-worm GRIL, and how do I inspect the answer?"
state = "planned"
planned_source = "docs/generalized_rank.md"
scope = "Follow an existing encoded module through selected-label queries, validation, scalar-first results and optional witnesses. Explore an explicitly supplied interval family, total compression, negative coefficients and reconstruction restricted to declared queries. Then use a positively oriented two-dimensional grid encoding for fixed centers, rank levels and worm lengths; explain the right-continuous zero-below/constant-above extension, exact rational widths, feature-array order and query/output budgets. Include runnable fork, negative-coefficient and rectangle/quadrant examples from docs/examples/generalized_rank.jl; show errors for disconnected/nonconvex domains and unsupported geometric encodings. Link the mathematical lesson and B54 at the point of need rather than repeating proofs. No training or autodiff interface is implied. When inspecting A86 signed-family cancellation, select a declared observable/query, show positive and negative contributions, and reconstruct its directly computed value. Distinguish that region-family example from pair-rank or Hilbert/Euler measures, whose query domains and inversions are explained in guide_slices_diagrams."
plan_ids = ["A54", "B54", "A86"]
related = ["guide_inputs", "guide_spaces_maps", "generalized_rank_lesson", "B54", "features_lesson", "ref_invariants", "ref_features"]
