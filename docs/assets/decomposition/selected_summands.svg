<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 385" role="img" aria-labelledby="title desc">
<title id="title">Selected interval blocks and their complement</title><desc id="desc">Three copies of a finite square show stalk dimensions. The full module has 1,2,1,4. The selected edge and two sink copies have 0,1,0,3. Their constant-square complement has dimension 1 at every vertex. The number beside a node is a dimension, not the name of a summand.</desc>
<defs><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#516472"/></marker></defs>
<rect width="1020" height="385" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" fill="#193b4b" text-anchor="middle">
<text x="170" y="32" font-size="22">Full module</text><text x="510" y="32" font-size="22">Selected blocks</text><text x="850" y="32" font-size="22">Complement</text>
<g transform="translate(170,70)">
<g fill="none" stroke="#516472" stroke-width="1.6" marker-end="url(#arr)"><path d="M-12 176L-72 109"/><path d="M12 176L72 109"/><path d="M-73 82L-13 14"/><path d="M73 82L13 14"/></g>
<circle cx="0" cy="190" r="18" fill="#156b91" stroke="#156b91"/><text x="0" y="196" font-size="18" fill="white">1</text><text x="0" y="229" font-size="13">vertex 1</text><circle cx="-85" cy="95" r="18" fill="#156b91" stroke="#156b91"/><text x="-85" y="101" font-size="18" fill="white">2</text><text x="-85" y="134" font-size="13">vertex 2</text><circle cx="85" cy="95" r="18" fill="#156b91" stroke="#156b91"/><text x="85" y="101" font-size="18" fill="white">1</text><text x="85" y="134" font-size="13">vertex 3</text><circle cx="0" cy="0" r="18" fill="#156b91" stroke="#156b91"/><text x="0" y="6" font-size="18" fill="white">4</text><text x="0" y="39" font-size="13">vertex 4</text></g><g transform="translate(510,70)">
<g fill="none" stroke="#516472" stroke-width="1.6" marker-end="url(#arr)"><path d="M-12 176L-72 109"/><path d="M12 176L72 109"/><path d="M-73 82L-13 14"/><path d="M73 82L13 14"/></g>
<circle cx="0" cy="190" r="18" fill="white" stroke="#156b91"/><text x="0" y="196" font-size="18" fill="#193b4b">0</text><text x="0" y="229" font-size="13">vertex 1</text><circle cx="-85" cy="95" r="18" fill="#ad5315" stroke="#156b91"/><text x="-85" y="101" font-size="18" fill="white">1</text><text x="-85" y="134" font-size="13">vertex 2</text><circle cx="85" cy="95" r="18" fill="white" stroke="#156b91"/><text x="85" y="101" font-size="18" fill="#193b4b">0</text><text x="85" y="134" font-size="13">vertex 3</text><circle cx="0" cy="0" r="18" fill="#ad5315" stroke="#156b91"/><text x="0" y="6" font-size="18" fill="white">3</text><text x="0" y="39" font-size="13">vertex 4</text></g><g transform="translate(850,70)">
<g fill="none" stroke="#516472" stroke-width="1.6" marker-end="url(#arr)"><path d="M-12 176L-72 109"/><path d="M12 176L72 109"/><path d="M-73 82L-13 14"/><path d="M73 82L13 14"/></g>
<circle cx="0" cy="190" r="18" fill="#477969" stroke="#156b91"/><text x="0" y="196" font-size="18" fill="white">1</text><text x="0" y="229" font-size="13">vertex 1</text><circle cx="-85" cy="95" r="18" fill="#477969" stroke="#156b91"/><text x="-85" y="101" font-size="18" fill="white">1</text><text x="-85" y="134" font-size="13">vertex 2</text><circle cx="85" cy="95" r="18" fill="#477969" stroke="#156b91"/><text x="85" y="101" font-size="18" fill="white">1</text><text x="85" y="134" font-size="13">vertex 3</text><circle cx="0" cy="0" r="18" fill="#477969" stroke="#156b91"/><text x="0" y="6" font-size="18" fill="white">1</text><text x="0" y="39" font-size="13">vertex 4</text></g>
<text x="340" y="165" font-size="34">=</text><text x="680" y="165" font-size="34">+</text>
<text x="510" y="345" font-size="18">At vertex 4: k⁴ = k³ ⊕ k. The checked maps make this a module splitting.</text>
<text x="510" y="375" font-size="15">Numbers are stalk dimensions; node positions show the finite order.</text>
</g></svg>