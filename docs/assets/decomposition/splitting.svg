<svg xmlns="http://www.w3.org/2000/svg" width="820" height="270" viewBox="0 0 820 270" role="img" aria-labelledby="title desc">
<title id="title">A certified module splitting</title><desc id="desc">S and R each have an inclusion into M and a projection back. The composites p i and q j are identities, the mixed composites vanish, and i p plus j q is the identity of M.</desc>
<rect width="820" height="270" rx="10" fill="#fff"/>
<g font-family="system-ui,sans-serif" fill="#173747" text-anchor="middle">
<g fill="#f0f7fa" stroke="#156b91" stroke-width="2"><rect x="30" y="54" width="180" height="90" rx="10"/><rect x="320" y="54" width="180" height="90" rx="10"/><rect x="610" y="54" width="180" height="90" rx="10"/></g>
<text x="120" y="88" font-size="24">S</text><text x="120" y="119" font-size="16">interval summands</text>
<text x="410" y="88" font-size="24">M</text><text x="410" y="119" font-size="16">the finite module</text>
<text x="700" y="88" font-size="24">R</text><text x="700" y="119" font-size="16">the residual</text>
<g stroke="#156b91" stroke-width="2" fill="none"><path d="M 218 77 H 309 l -8 -5 m 8 5 l -8 5 M 312 119 H 220 l 8 -5 m -8 5 l 8 5 M 602 77 H 510 l 8 -5 m -8 5 l 8 5 M 508 119 H 600 l -8 -5 m 8 5 l -8 5"/></g>
<g font-size="16"><text x="264" y="64">inclusion i</text><text x="264" y="145">projection p</text><text x="556" y="64">inclusion j</text><text x="556" y="145">projection q</text></g>
<text x="410" y="206" font-size="20">p i = 1     q j = 1     p j = 0     q i = 0</text>
<text x="410" y="241" font-size="20">i p + j q = 1 on M</text></g></svg>
