<title id="title">Nine band labels reduce to four signatures</title>
<desc id="description">An authored schematic of the closed square on the whole real plane. A cropped three by three grid labels each region by its band pair and signature. L means less than zero, C means zero through two inclusive, and H means greater than two. The disconnected upper left and lower right regions share signature (0,1). Below, pi nine sends (1,1) to (C,C), rho sends it to (1,0), and pi four gives (1,0) directly.</desc>
