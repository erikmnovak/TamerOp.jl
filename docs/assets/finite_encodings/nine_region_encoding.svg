<title id="title">Nine parameter regions and their finite poset</title>
<desc id="description">An authored schematic in two stacked panels. The upper panel assigns each parameter its band pair, using L below zero, C from zero through two inclusive, and H above two. The lower panel is the nine-element product poset, with arrows rightward and upward. Only the central label carries Q; the others carry zero. The outer parameter regions continue beyond the drawing window.</desc>
