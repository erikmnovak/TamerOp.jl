<svg xmlns="http://www.w3.org/2000/svg" width="520" height="838" viewBox="0 0 520 838" role="img" aria-labelledby="title description">
<title id="title">Chains and cocycles on source cells</title>
<desc id="description">A chain map i sends computed chains C to source chains S. A retained retraction p goes from S to C and recovers a computed chain after lifting. A filling f with boundary z maps to a filling i f whose boundary is i z. A computed cocycle alpha evaluates a source chain s by applying p first: (p transpose alpha)(s) equals alpha(p s). The source cochain is restricted to active cells. This is a schematic of the map equations.</desc>
<!-- Authored schematic; regenerate with docs/build_scripts/render_source_figures.py. -->
<defs>
<marker id="lift" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#245c99" stroke-width="1.5"/></marker>
<marker id="retraction" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#0f766e" stroke-width="1.5"/></marker>
<marker id="boundary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#475569" stroke-width="1.5"/></marker>
</defs>
<rect width="520" height="838" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" fill="#172b42" text-anchor="middle">
<text x="260" y="37" font-size="25" fill="#172b42">Chains and cocycles on source cells</text>
<rect x="22" y="75" width="192" height="112" rx="10" fill="#eef5fb" stroke="#93b3cf" stroke-width="1.5"/>
<text x="118" y="113" font-size="25" fill="#172b42">Computed</text>
<text x="118" y="157" font-size="27" fill="#172b42">chains C</text>
<rect x="306" y="75" width="192" height="112" rx="10" fill="#eef5fb" stroke="#93b3cf" stroke-width="1.5"/>
<text x="402" y="113" font-size="25" fill="#172b42">Source</text>
<text x="402" y="157" font-size="27" fill="#172b42">chains S</text>
<path d="M 220 126 L 300 126" stroke="#245c99" stroke-width="2.5" fill="none" marker-end="url(#lift)"/>
<text x="260" y="111" font-size="26" fill="#245c99">i</text>
<path d="M 300 162 L 220 162" stroke="#0f766e" stroke-width="2.5" fill="none" marker-end="url(#retraction)"/>
<text x="260" y="193" font-size="26" fill="#0f766e">p</text>
<text x="260" y="229" font-size="23" fill="#172b42">When a retraction p is retained,</text>
<text x="260" y="260" font-size="23" fill="#172b42">p(i(c)) = c for each computed chain c.</text>
<path d="M 26 283 H 494" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="260" y="324" font-size="25" fill="#172b42">A filling and its boundary</text>
<text x="118" y="374" font-size="31" fill="#245c99">f</text>
<text x="402" y="374" font-size="31" fill="#245c99">i f</text>
<path d="M 155 364 L 365 364" stroke="#245c99" stroke-width="2.5" fill="none" marker-end="url(#lift)"/>
<text x="260" y="352" font-size="24" fill="#245c99">i</text>
<path d="M 118 387 L 118 434" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#boundary)"/>
<path d="M 402 387 L 402 434" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#boundary)"/>
<text x="88" y="419" font-size="27" fill="#475569">∂</text>
<text x="372" y="419" font-size="27" fill="#475569">∂</text>
<text x="118" y="476" font-size="31" fill="#245c99">z</text>
<text x="402" y="476" font-size="31" fill="#245c99">i z</text>
<path d="M 155 466 L 365 466" stroke="#245c99" stroke-width="2.5" fill="none" marker-end="url(#lift)"/>
<text x="260" y="453" font-size="24" fill="#245c99">i</text>
<text x="260" y="523" font-size="26" fill="#172b42">∂f = z   ⇒   ∂(i f) = i z</text>
<text x="260" y="561" font-size="23" fill="#172b42">The cycle z is filled by f at death.</text>
<path d="M 26 586 H 494" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="260" y="629" font-size="25" fill="#172b42">A cocycle evaluates source chains</text>
<text x="118" y="682" font-size="31" fill="#0f766e">α</text>
<text x="402" y="682" font-size="31" fill="#0f766e">pᵀα</text>
<path d="M 155 672 L 355 672" stroke="#0f766e" stroke-width="2.5" fill="none" marker-end="url(#retraction)"/>
<text x="260" y="660" font-size="24" fill="#0f766e">pᵀ</text>
<text x="260" y="727" font-size="27" fill="#172b42">(pᵀα)(s) = α(p s)</text>
<text x="260" y="767" font-size="23" fill="#172b42">Send s back by p, then evaluate α.</text>
<text x="260" y="798" font-size="23" fill="#172b42">Use only active source cells.</text>
</g></svg>
