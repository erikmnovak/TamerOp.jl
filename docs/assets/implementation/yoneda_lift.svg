<svg xmlns="http://www.w3.org/2000/svg" width="840" height="350" viewBox="0 0 840 350" role="img" aria-labelledby="title desc">
  <title id="title">Lift the right class, then compose and pass to quotient coordinates</title>
  <desc id="desc">A comparison lift F_p maps P_(p+q)(L) to P_p(M). The left cocycle b then maps to N. Their composite represents the product. Quotient coordinates identify cocycles that differ by an incoming boundary.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs>
  <rect x="1" y="1" width="838" height="348" rx="16" fill="#fff" stroke="#d5dde7"/>
  <g font-family="system-ui,sans-serif" text-anchor="middle" fill="#172d40">
    <text x="420" y="35" font-size="20" font-weight="600">A product uses a lift between resolutions</text>
    <rect x="30" y="92" width="200" height="66" rx="10" fill="#edf5fb" stroke="#5083a5"/>
    <text x="130" y="133" font-size="22">P<tspan baseline-shift="sub" font-size="14">p+q</tspan>(L)</text>
    <rect x="335" y="92" width="185" height="66" rx="10" fill="#edf5fb" stroke="#5083a5"/>
    <text x="427" y="133" font-size="22">P<tspan baseline-shift="sub" font-size="14">p</tspan>(M)</text>
    <rect x="642" y="92" width="155" height="66" rx="10" fill="#edf5fb" stroke="#5083a5"/>
    <text x="720" y="133" font-size="22">N</text>
    <path d="M233 126H327" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="282" y="75" font-size="16">lift F<tspan baseline-shift="sub" font-size="11">p</tspan></text>
    <path d="M523 126H634" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="578" y="75" font-size="16">cocycle b</text>
    <path d="M130 161V215H720V163" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="425" y="202" font-size="17">composite z = b F<tspan baseline-shift="sub" font-size="12">p</tspan></text>
    <text x="420" y="271" font-size="18">Check dz = 0, then recover the class coordinates c.</text>
    <text x="420" y="305" font-size="17">Retain the witness z = chosen representative(c) + dw.</text>
  </g>
</svg>
