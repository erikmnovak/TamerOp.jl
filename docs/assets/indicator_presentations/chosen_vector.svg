<svg xmlns="http://www.w3.org/2000/svg" width="500" height="714" viewBox="0 0 500 714" role="img" aria-labelledby="title description">
<title id="title">A vector enters the overlap and then maps to zero</title>
<desc id="description">An authored schematic over k in the summand bases of the two closed squares. At p=(one half, one half), the selected vector is one. The column (1,0) sends it to (1,0) at q=(three halves, three halves). The row (0,1) sends it to zero at r=(five halves, five halves). The target space at r is k, belonging to the second square.</desc>
