<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title description">
  <title id="title">Two overlapping square summands and their structure maps</title>
  <desc id="description">An authored schematic of the direct sum of two square indicator modules over a coefficient field k. The blue square S one is the closed square zero to two in each coordinate. The teal square S two is the closed square one to three in each coordinate. Their overlap has dimension two. Three comparable parameter points lie on the diagonal: p equals one half, one half; q equals three halves, three halves; r equals five halves, five halves. The space at p is k from S one alone, the space at q is k squared with ordered summand basis S one, S two, and the space at r is k from S two alone. The map from p to q is the column vector with entries one, zero. The map from q to r is the row vector with entries zero, one. Their composite from p to r is zero.</desc>
  <defs>
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="map-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#0f766e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="960" height="620" fill="#ffffff"/>
  <g font-family="DejaVu Sans, sans-serif" fill="#172b42" text-anchor="middle">
    <text x="480" y="40" font-size="29">Two indicator summands overlap</text>
    <text x="250" y="91" font-size="24">Parameter plane</text>
    <text x="710" y="91" font-size="24">Maps in summand bases</text>

    <!-- Equal coordinate scale: origin (85,470), 100 SVG units per unit. -->
    <rect x="85" y="270" width="200" height="200" fill="#dbeafe"/>
    <rect x="185" y="170" width="200" height="200" fill="#d5eee9"/>
    <rect x="185" y="270" width="100" height="100" fill="#b7d6dd"/>
    <rect x="85" y="270" width="200" height="200" fill="none" stroke="#245c99" stroke-width="2.5"/>
    <rect x="185" y="170" width="200" height="200" fill="none" stroke="#0f766e" stroke-width="2.5"/>
    <g fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#axis-arrow)">
      <path d="M 65 470 H 430"/>
      <path d="M 85 490 V 125"/>
    </g>
    <g fill="none" stroke="#64748b" stroke-width="1.5">
      <path d="M 185 466 V 475 M 285 466 V 475 M 385 466 V 475"/>
      <path d="M 81 370 H 90 M 81 270 H 90 M 81 170 H 90"/>
    </g>
    <g font-size="20" fill="#475569">
      <text x="67" y="495">0</text>
      <text x="185" y="498">1</text>
      <text x="285" y="498">2</text>
      <text x="385" y="498">3</text>
      <text x="64" y="377">1</text>
      <text x="64" y="277">2</text>
      <text x="64" y="177">3</text>
      <text x="447" y="478" font-size="24">x</text>
      <text x="67" y="129" font-size="24">y</text>
    </g>
    <g fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#map-arrow)">
      <path d="M 145 410 L 224 331"/>
      <path d="M 246 309 L 324 231"/>
    </g>
    <g fill="#172b42" stroke="#ffffff" stroke-width="2">
      <circle cx="135" cy="420" r="6.5"/>
      <circle cx="235" cy="320" r="6.5"/>
      <circle cx="335" cy="220" r="6.5"/>
    </g>
    <g font-size="24">
      <text x="116" y="412">p</text>
      <text x="254" y="343">q</text>
      <text x="354" y="242">r</text>
      <text x="123" y="301" fill="#245c99">S₁</text>
      <text x="350" y="348" fill="#0f766e">S₂</text>
    </g>
    <text x="235" y="295" font-size="20">dim 2</text>
    <text x="250" y="546" font-size="23" fill="#245c99">S₁ = [0, 2]²</text>
    <text x="250" y="581" font-size="23" fill="#0f766e">S₂ = [1, 3]²</text>

    <g font-size="22">
      <text x="710" y="140">p = (1/2, 1/2)</text>
      <text x="710" y="285">q = (3/2, 3/2)</text>
      <text x="710" y="430">r = (5/2, 5/2)</text>
    </g>
    <g font-size="33">
      <text x="710" y="180">k</text>
      <text x="710" y="325">k²</text>
      <text x="710" y="470">k</text>
    </g>
    <g fill="none" stroke="#0f766e" stroke-width="2.7" marker-end="url(#map-arrow)">
      <path d="M 710 197 V 252"/>
      <path d="M 710 342 V 397"/>
    </g>
    <!-- Column and row matrices are drawn explicitly, keeping their shapes clear. -->
    <g fill="none" stroke="#172b42" stroke-width="1.6">
      <path d="M 758 199 H 751 V 250 H 758"/>
      <path d="M 789 199 H 796 V 250 H 789"/>
      <path d="M 758 351 H 751 V 384 H 758"/>
      <path d="M 821 351 H 828 V 384 H 821"/>
    </g>
    <g font-size="23">
      <text x="773.5" y="220">1</text>
      <text x="773.5" y="245">0</text>
      <text x="773" y="376">0</text>
      <text x="805" y="376">1</text>
    </g>
    <text x="710" y="533" font-size="24">Composite p → r: 0</text>
    <text x="710" y="579" font-size="21" fill="#475569">At q, the basis order is (S₁, S₂).</text>
  </g>
</svg>
