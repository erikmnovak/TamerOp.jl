<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title description">
  <title id="title">An upset and a downset meet in a closed square</title>
  <desc id="description">Three authored parameter-plane schematics with horizontal coordinate x and vertical coordinate y, each increasing in its usual direction. The first panel shades the upset U, where x and y are both at least zero, in blue. It continues upward and rightward beyond the dashed drawing window. The second shades the downset D, where x and y are both at most two, in teal. It continues leftward and downward beyond the window. The third shades their intersection, the closed square from zero to two in both coordinates. Solid colored lines mark included boundaries. Dashed outer frames only crop the drawings; they are not boundaries of U or D.</desc>
  <defs>
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1000" height="500" fill="#ffffff"/>
  <g font-family="DejaVu Sans, sans-serif" fill="#172b42" text-anchor="middle">
    <text x="500" y="39" font-size="29">An upset and a downset meet in a square</text>
    <g transform="translate(25 0)">
      <text x="145" y="90" font-size="24" fill="#245c99">U: x ≥ 0, y ≥ 0</text>
      <rect x="30" y="125" width="240" height="240" fill="#f8fafc"/>
      <rect x="90" y="125" width="180" height="180" fill="#dbeafe"/>
      <path d="M 90 125 V 305 H 270" fill="none" stroke="#245c99" stroke-width="2.5"/>
      <rect x="30" y="125" width="240" height="240" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/>
      <g fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#axis-arrow)">
        <path d="M 15 385 H 285"/>
        <path d="M 15 385 V 112"/>
      </g>
      <g fill="none" stroke="#64748b" stroke-width="1.5">
        <path d="M 90 381 V 390 M 210 381 V 390"/>
        <path d="M 10 305 H 20 M 10 185 H 20"/>
      </g>
      <g font-size="20" fill="#475569">
        <text x="90" y="412">0</text>
        <text x="210" y="412">2</text>
        <text x="0" y="312">0</text>
        <text x="0" y="192">2</text>
        <text x="300" y="393" font-size="24">x</text>
        <text x="4" y="107" font-size="24">y</text>
      </g>
      <text x="180" y="231" font-size="30" fill="#245c99">U</text>
      <text x="150" y="447" font-size="21" fill="#245c99">Continues ↑ and →</text>
    </g>
    <g transform="translate(355 0)">
      <text x="145" y="90" font-size="24" fill="#0f766e">D: x ≤ 2, y ≤ 2</text>
      <rect x="30" y="125" width="240" height="240" fill="#f8fafc"/>
      <rect x="30" y="185" width="180" height="180" fill="#d5eee9"/>
      <path d="M 30 185 H 210 V 365" fill="none" stroke="#0f766e" stroke-width="2.5"/>
      <rect x="30" y="125" width="240" height="240" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/>
      <g fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#axis-arrow)">
        <path d="M 15 385 H 285"/>
        <path d="M 15 385 V 112"/>
      </g>
      <g fill="none" stroke="#64748b" stroke-width="1.5">
        <path d="M 90 381 V 390 M 210 381 V 390"/>
        <path d="M 10 305 H 20 M 10 185 H 20"/>
      </g>
      <g font-size="20" fill="#475569">
        <text x="90" y="412">0</text>
        <text x="210" y="412">2</text>
        <text x="0" y="312">0</text>
        <text x="0" y="192">2</text>
        <text x="300" y="393" font-size="24">x</text>
        <text x="4" y="107" font-size="24">y</text>
      </g>
      <text x="120" y="291" font-size="30" fill="#0f766e">D</text>
      <text x="150" y="447" font-size="21" fill="#0f766e">Continues ← and ↓</text>
    </g>
    <g transform="translate(685 0)">
      <text x="145" y="90" font-size="24">U ∩ D = [0, 2]²</text>
      <rect x="30" y="125" width="240" height="240" fill="#f8fafc"/>
      <rect x="90" y="185" width="120" height="120" fill="#b7d6dd" stroke="#245c99" stroke-width="2.5"/>
      <rect x="30" y="125" width="240" height="240" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/>
      <g fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#axis-arrow)">
        <path d="M 15 385 H 285"/>
        <path d="M 15 385 V 112"/>
      </g>
      <g fill="none" stroke="#64748b" stroke-width="1.5">
        <path d="M 90 381 V 390 M 210 381 V 390"/>
        <path d="M 10 305 H 20 M 10 185 H 20"/>
      </g>
      <g font-size="20" fill="#475569">
        <text x="90" y="412">0</text>
        <text x="210" y="412">2</text>
        <text x="0" y="312">0</text>
        <text x="0" y="192">2</text>
        <text x="300" y="393" font-size="24">x</text>
        <text x="4" y="107" font-size="24">y</text>
      </g>
      <text x="150" y="256" font-size="27">U ∩ D</text>
      <text x="150" y="447" font-size="21">All four edges included</text>
    </g>
    <text x="500" y="485" font-size="20" fill="#475569">Dashed frames crop the drawings. Solid colored boundaries are included.</text>
  </g>
</svg>
