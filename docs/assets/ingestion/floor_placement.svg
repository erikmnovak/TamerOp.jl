<svg xmlns="http://www.w3.org/2000/svg" width="520" height="710" viewBox="0 0 520 710" role="img" aria-labelledby="title description">
<title id="title">Restriction and floor placement give different sampled filtrations</title>
<desc id="description">A single cell is born at grade one. Restricting to grid zero and two keeps it absent at zero. Floor placement moves its birth to zero. Filled circles mean the cell is present; the open circle means it is absent.</desc>
<!-- Authored schematic; regenerate with docs/build_scripts/render_input_diagrams.py. -->
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#526473"/></marker></defs>
<rect width="520" height="710" fill="#fffdf8"/>
<g font-family="DejaVu Sans, sans-serif" fill="#243c49" stroke-linecap="round" stroke-linejoin="round">
<text x="260" y="38" font-size="26" text-anchor="middle" fill="#243c49">A cell born at grade 1</text>
<text x="260" y="79" font-size="23" text-anchor="middle" fill="#243c49">Supplied grid: {0, 2}</text>
<text x="260" y="128" font-size="24" text-anchor="middle" fill="#243c49">Original filtration</text>
<line x1="82" y1="181" x2="465" y2="181" stroke="#526473" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="90" y1="175" x2="90" y2="187" stroke="#526473" stroke-width="2"/>
<text x="90" y="216" font-size="23" text-anchor="middle" fill="#243c49">0</text>
<line x1="265" y1="175" x2="265" y2="187" stroke="#526473" stroke-width="2"/>
<text x="265" y="216" font-size="23" text-anchor="middle" fill="#243c49">1</text>
<line x1="440" y1="175" x2="440" y2="187" stroke="#526473" stroke-width="2"/>
<text x="440" y="216" font-size="23" text-anchor="middle" fill="#243c49">2</text>
<text x="260" y="302" font-size="24" text-anchor="middle" fill="#243c49">Restriction to the grid</text>
<line x1="82" y1="355" x2="465" y2="355" stroke="#526473" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="90" y1="349" x2="90" y2="361" stroke="#526473" stroke-width="2"/>
<text x="90" y="390" font-size="23" text-anchor="middle" fill="#243c49">0</text>
<line x1="265" y1="349" x2="265" y2="361" stroke="#526473" stroke-width="2"/>
<text x="265" y="390" font-size="23" text-anchor="middle" fill="#243c49">1</text>
<line x1="440" y1="349" x2="440" y2="361" stroke="#526473" stroke-width="2"/>
<text x="440" y="390" font-size="23" text-anchor="middle" fill="#243c49">2</text>
<text x="260" y="485" font-size="24" text-anchor="middle" fill="#243c49">Floor placement</text>
<line x1="82" y1="538" x2="465" y2="538" stroke="#526473" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="90" y1="532" x2="90" y2="544" stroke="#526473" stroke-width="2"/>
<text x="90" y="573" font-size="23" text-anchor="middle" fill="#243c49">0</text>
<line x1="265" y1="532" x2="265" y2="544" stroke="#526473" stroke-width="2"/>
<text x="265" y="573" font-size="23" text-anchor="middle" fill="#243c49">1</text>
<line x1="440" y1="532" x2="440" y2="544" stroke="#526473" stroke-width="2"/>
<text x="440" y="573" font-size="23" text-anchor="middle" fill="#243c49">2</text>
<line x1="265" y1="181" x2="440" y2="181" stroke="#287271" stroke-width="7"/>
<circle cx="265" cy="181" r="8" fill="#287271" stroke="#287271" stroke-width="3"/>
<text x="265" y="165" font-size="22" text-anchor="middle" fill="#243c49">birth</text>
<circle cx="90" cy="355" r="8" fill="#fffdf8" stroke="#287271" stroke-width="3"/>
<circle cx="440" cy="355" r="8" fill="#287271" stroke="#287271" stroke-width="3"/>
<text x="90" y="426" font-size="22" text-anchor="middle" fill="#243c49">absent</text>
<text x="440" y="426" font-size="22" text-anchor="middle" fill="#243c49">present</text>
<line x1="90" y1="538" x2="440" y2="538" stroke="#287271" stroke-width="7"/>
<circle cx="90" cy="538" r="8" fill="#287271" stroke="#287271" stroke-width="3"/>
<circle cx="440" cy="538" r="8" fill="#287271" stroke="#287271" stroke-width="3"/>
<text x="260" y="610" font-size="23" text-anchor="middle" fill="#243c49">The birth has moved to 0.</text>
<text x="260" y="677" font-size="23" text-anchor="middle" fill="#243c49">Parameter increases to the right.</text>
</g></svg>
