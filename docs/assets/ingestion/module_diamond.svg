<svg xmlns="http://www.w3.org/2000/svg" width="520" height="646" viewBox="0 0 520 646" role="img" aria-labelledby="title description">
<title id="title">A finite module needs equal composites around the diamond</title>
<desc id="description">Four rational spaces labelled one through four. Both paths from one to four consist of two maps. The left path gives one; the right gives two. Changing the map from three to four to one makes the two composites agree.</desc>
<!-- Authored schematic; regenerate with docs/build_scripts/render_input_diagrams.py. -->
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#526473"/></marker></defs>
<rect width="520" height="646" fill="#fffdf8"/>
<g font-family="DejaVu Sans, sans-serif" fill="#243c49" stroke-linecap="round" stroke-linejoin="round">
<text x="260" y="38" font-size="25" text-anchor="middle" fill="#243c49">Two paths through the diamond</text>
<text x="260" y="82" font-size="23" text-anchor="middle" fill="#243c49">Every space is ℚ.</text>
<text x="260" y="116" font-size="23" text-anchor="middle" fill="#243c49">Arrow labels are scalar matrices.</text>
<line x1="244" y1="398" x2="120" y2="305" stroke="#526473" stroke-width="3" marker-end="url(#arrow)"/>
<text x="160" y="369" font-size="25" text-anchor="middle" fill="#526473">[1]</text>
<line x1="276" y1="398" x2="400" y2="305" stroke="#526473" stroke-width="3" marker-end="url(#arrow)"/>
<text x="360" y="369" font-size="25" text-anchor="middle" fill="#526473">[1]</text>
<line x1="120" y1="276" x2="244" y2="190" stroke="#526473" stroke-width="3" marker-end="url(#arrow)"/>
<text x="160" y="232" font-size="25" text-anchor="middle" fill="#526473">[1]</text>
<line x1="400" y1="276" x2="276" y2="190" stroke="#a34f2f" stroke-width="3" marker-end="url(#arrow)"/>
<text x="360" y="232" font-size="25" text-anchor="middle" fill="#a34f2f">[2]</text>
<text x="260" y="424" font-size="26" text-anchor="middle" fill="#243c49">1: ℚ</text>
<text x="88" y="298" font-size="26" text-anchor="middle" fill="#243c49">2: ℚ</text>
<text x="432" y="298" font-size="26" text-anchor="middle" fill="#243c49">3: ℚ</text>
<text x="260" y="179" font-size="26" text-anchor="middle" fill="#243c49">4: ℚ</text>
<text x="260" y="477" font-size="24" text-anchor="middle" fill="#243c49">via 2: 1 × 1 = 1</text>
<text x="260" y="519" font-size="24" text-anchor="middle" fill="#a34f2f">via 3: 2 × 1 = 2</text>
<text x="260" y="582" font-size="24" text-anchor="middle" fill="#243c49">Set the map 3 → 4 to [1].</text>
<text x="260" y="620" font-size="23" text-anchor="middle" fill="#243c49">Both composites then equal [1].</text>
</g></svg>
