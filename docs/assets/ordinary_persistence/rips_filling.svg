<title id="title">The diagonal fills a four-edge cycle</title>
<desc id="description">A schematic of the supplied sparse weighted graph, over F two. Four edges form a cycle at parameter one. At two the diagonal from vertex one to vertex three enters together with triangles 123 and 134. Their common diagonal cancels in the boundary, leaving the original cycle. First homology has interval [1,2). Positions do not encode distances.</desc>
