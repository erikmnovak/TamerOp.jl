<svg xmlns="http://www.w3.org/2000/svg" width="500" height="590" viewBox="0 0 500 590" role="img" aria-labelledby="title description">
<title id="title">Two routes give the same linear map</title>
<desc id="description">An authored module over any field k on p less than q and r less than s. The spaces at p and s are k, and those at q and r are k squared. The maps from p are columns (1,0) and (0,1); each map to s is row (1,1). The vector one reaches one along either route. There is no comparison between q and r.</desc>
