<g font-family="DejaVu Sans, sans-serif" fill="#172b42" text-anchor="middle">
<text x="250" y="36" font-size="25" fill="#172b42" text-anchor="middle">Two routes through the same module</text>
<text x="250" y="70" font-size="22" fill="#475569" text-anchor="middle">Matrices act on the selected vectors</text>
<rect x="40" y="124" width="150" height="96" fill="#eff6ff" stroke="#245c99" stroke-width="2" rx="7" stroke-dasharray=""/>
<text x="115" y="160" font-size="23" fill="#172b42" text-anchor="middle">M(p) = k</text>
<text x="115" y="200" font-size="27" fill="#245c99" text-anchor="middle">1</text>
<rect x="300" y="124" width="150" height="96" fill="#eff6ff" stroke="#245c99" stroke-width="2" rx="7" stroke-dasharray=""/>
<text x="375" y="160" font-size="23" fill="#172b42" text-anchor="middle">M(q) = k²</text>
<text x="375" y="200" font-size="27" fill="#245c99" text-anchor="middle">(1, 0)</text>
<rect x="40" y="376" width="150" height="96" fill="#eff6ff" stroke="#245c99" stroke-width="2" rx="7" stroke-dasharray=""/>
<text x="115" y="412" font-size="23" fill="#172b42" text-anchor="middle">M(r) = k²</text>
<text x="115" y="452" font-size="27" fill="#245c99" text-anchor="middle">(0, 1)</text>
<rect x="300" y="376" width="150" height="96" fill="#eff6ff" stroke="#245c99" stroke-width="2" rx="7" stroke-dasharray=""/>
<text x="375" y="412" font-size="23" fill="#172b42" text-anchor="middle">M(s) = k</text>
<text x="375" y="452" font-size="27" fill="#245c99" text-anchor="middle">1</text>
