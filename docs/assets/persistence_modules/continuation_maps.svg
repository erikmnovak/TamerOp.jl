<svg xmlns="http://www.w3.org/2000/svg" width="440" height="590" viewBox="0 0 440 590" role="img" aria-labelledby="title description">
  <title id="title">Equal dimensions with different continuation maps</title>
  <desc id="description">Two modules are shown on ordered parameters u less than v. Both assign the field k, a vector space of dimension one, to each parameter. In the upper module the identity map sends 1 to 1 and its image is all of k. In the lower module the zero map sends 1 to 0 and its image consists only of zero. The target of the zero map is still k and has dimension one. Boxes represent vector spaces, not regions of an underlying shape. This is an authored schematic.</desc>
  <defs>
    <marker id="map-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#0f766e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="440" height="590" fill="#ffffff"/>
  <g font-family="DejaVu Sans, sans-serif" fill="#172b42" text-anchor="middle">
    <text x="220" y="34" font-size="23">Two maps on the same spaces</text>
    <text x="220" y="65" font-size="21" fill="#475569">Ordered parameters u &lt; v</text>

    <text x="220" y="108" font-size="23">The identity map</text>
    <text x="85" y="144" font-size="22">at u</text>
    <text x="355" y="144" font-size="22">at v</text>
    <g fill="#f1f6fb" stroke="#245c99" stroke-width="1.8">
      <rect x="20" y="156" width="130" height="80" rx="8"/>
      <rect x="290" y="156" width="130" height="80" rx="8"/>
    </g>
    <g font-family="DejaVu Serif, serif" font-style="italic" font-size="28">
      <text x="85" y="190">k</text>
      <text x="355" y="190">k</text>
    </g>
    <g font-size="20">
      <text x="85" y="219">dimension 1</text>
      <text x="355" y="219">dimension 1</text>
    </g>
    <path d="M 163 196 H 277" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#map-arrow)"/>
    <text x="220" y="183" font-size="21" fill="#145e59">identity</text>
    <text x="220" y="264" font-size="23">1 ↦ 1</text>
    <text x="220" y="295" font-size="21">The image is all of k.</text>

    <path d="M 20 317 H 420" fill="none" stroke="#cbd5e1" stroke-width="1"/>

    <text x="220" y="352" font-size="23">The zero map</text>
    <text x="85" y="388" font-size="22">at u</text>
    <text x="355" y="388" font-size="22">at v</text>
    <g fill="#f1f6fb" stroke="#245c99" stroke-width="1.8">
      <rect x="20" y="400" width="130" height="80" rx="8"/>
      <rect x="290" y="400" width="130" height="80" rx="8"/>
    </g>
    <g font-family="DejaVu Serif, serif" font-style="italic" font-size="28">
      <text x="85" y="434">k</text>
      <text x="355" y="434">k</text>
    </g>
    <g font-size="20">
      <text x="85" y="463">dimension 1</text>
      <text x="355" y="463">dimension 1</text>
    </g>
    <path d="M 163 440 H 277" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#map-arrow)"/>
    <text x="220" y="427" font-size="21" fill="#145e59">zero</text>
    <text x="220" y="508" font-size="23">1 ↦ 0</text>
    <text x="220" y="539" font-size="21">The image is {0}.</text>
    <text x="220" y="570" font-size="20" fill="#475569">The target still has dimension one.</text>
  </g>
</svg>
