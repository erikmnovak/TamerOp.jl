<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="400" height="770" viewBox="0 0 400 770" role="img" aria-labelledby="title description">
  <title id="title">A square ring appears at zero and its hole fills at five</title>
  <desc id="description">Read downward through three stages connected by inclusion arrows. Before zero the shape is empty and its first homology is zero. From zero up to five, eight closed squares form a ring around an absent central square; its first homology over F two has dimension one. At five the center enters, marked new, and fills the hole, so first homology becomes zero. These are authored schematics. H one denotes first homology, with coefficients in F two.</desc>
  <defs>
    <marker id="inclusion-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#0f766e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <g id="outer-squares" fill="#dbeafe" stroke="#245c99" stroke-width="2">
      <rect x="0" y="0" width="50" height="50"/>
      <rect x="50" y="0" width="50" height="50"/>
      <rect x="100" y="0" width="50" height="50"/>
      <rect x="0" y="50" width="50" height="50"/>
      <rect x="100" y="50" width="50" height="50"/>
      <rect x="0" y="100" width="50" height="50"/>
      <rect x="50" y="100" width="50" height="50"/>
      <rect x="100" y="100" width="50" height="50"/>
    </g>
  </defs>
  <rect width="400" height="770" rx="10" fill="#ffffff"/>
  <g font-family="DejaVu Sans, sans-serif" fill="#172b42" text-anchor="middle">
    <!-- The empty shape has no grid or edges. -->
    <text x="99" y="112" font-size="78" fill="#475569">∅</text>
    <text x="285" y="73" font-size="28">t &lt; 0</text>
    <text x="285" y="118" font-size="27">H₁ = 0</text>
    <text x="285" y="157" font-size="22" fill="#475569">empty shape</text>

    <path d="M 99 180 V 233" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#inclusion-arrow)"/>
    <text x="126" y="217" font-size="22" text-anchor="start" fill="#145e59">inclusion</text>

    <use href="#outer-squares" xlink:href="#outer-squares" x="24" y="260"/>
    <text x="285" y="291" font-size="28">0 ≤ t &lt; 5</text>
    <text x="285" y="338" font-size="27">H₁ ≅ F₂</text>
    <text x="285" y="378" font-size="22" fill="#475569">one loop class</text>

    <path d="M 99 437 V 490" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#inclusion-arrow)"/>
    <text x="126" y="474" font-size="22" text-anchor="start" fill="#145e59">inclusion</text>

    <use href="#outer-squares" xlink:href="#outer-squares" x="24" y="522"/>
    <rect x="74" y="572" width="50" height="50" fill="#b7e2dd" stroke="#245c99" stroke-width="2"/>
    <text x="99" y="604" font-size="22" fill="#145e59">new</text>
    <text x="285" y="553" font-size="28">t ≥ 5</text>
    <text x="285" y="600" font-size="27">H₁ = 0</text>
    <text x="285" y="637" font-size="22" fill="#475569">the center</text>
    <text x="285" y="666" font-size="22" fill="#475569">fills the hole</text>

    <text x="200" y="719" font-size="22" fill="#475569">H₁: first homology</text>
    <text x="200" y="751" font-size="22" fill="#475569">Coefficients in F₂</text>
  </g>
</svg>
