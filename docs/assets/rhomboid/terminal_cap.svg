<svg xmlns="http://www.w3.org/2000/svg" width="520" height="911" viewBox="0 0 520 911" role="img" aria-labelledby="title description">
<title id="title">The terminal cap joins the two components at radius one</title>
<desc id="description">The rhomboid for two sites at zero and two is cut at depth one. Its horizontal section is an edge between the two singleton vertices. At radius below one those vertices are separate, and at radius one the cap joins them. The vertical axis is positive depth and the horizontal axis sums site coordinates.</desc>
<!-- Authored schematic; regenerate with docs/build_scripts/render_input_diagrams.py. -->
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#526473"/></marker></defs>
<rect width="520" height="911" fill="#fffdf8"/>
<g font-family="DejaVu Sans, sans-serif" fill="#243c49" stroke-linecap="round" stroke-linejoin="round">
<text x="260" y="38" font-size="25" text-anchor="middle" fill="#243c49">Why a depth window needs its cap</text>
<text x="260" y="82" font-size="23" text-anchor="middle" fill="#243c49">Two sites: u = 0 and v = 2.</text>
<text x="260" y="121" font-size="23" text-anchor="middle" fill="#243c49">Schematic at radius r = 1</text>
<line x1="75" y1="495" x2="75" y2="177" stroke="#526473" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="75" y1="495" x2="451" y2="495" stroke="#526473" stroke-width="2" marker-end="url(#arrow)"/>
<text x="75" y="160" font-size="23" text-anchor="middle" fill="#243c49">depth</text>
<polygon points="135,465 135,340 365,215 365,340" fill="#dceae6" stroke="#78958f" stroke-width="2"/>
<line x1="115" y1="340" x2="390" y2="340" stroke="#287271" stroke-width="5"/>
<circle cx="135" cy="465" r="8" fill="#287271" stroke="#287271" stroke-width="3"/>
<text x="155" y="472" font-size="23" text-anchor="start" fill="#243c49">∅</text>
<circle cx="135" cy="340" r="8" fill="#287271" stroke="#287271" stroke-width="3"/>
<text x="135" y="316" font-size="23" text-anchor="middle" fill="#243c49">{u}</text>
<circle cx="365" cy="340" r="8" fill="#287271" stroke="#287271" stroke-width="3"/>
<text x="395" y="348" font-size="23" text-anchor="start" fill="#243c49">{v}</text>
<circle cx="365" cy="215" r="8" fill="#287271" stroke="#287271" stroke-width="3"/>
<text x="365" y="194" font-size="23" text-anchor="middle" fill="#243c49">{u,v}</text>
<text x="61" y="472" font-size="23" text-anchor="end" fill="#243c49">0</text>
<text x="61" y="347" font-size="23" text-anchor="end" fill="#243c49">1</text>
<text x="61" y="222" font-size="23" text-anchor="end" fill="#243c49">2</text>
<text x="135" y="527" font-size="23" text-anchor="middle" fill="#243c49">0</text>
<text x="365" y="527" font-size="23" text-anchor="middle" fill="#243c49">2</text>
<text x="260" y="380" font-size="23" text-anchor="middle" fill="#243c49">cap at depth 1</text>
<text x="260" y="566" font-size="23" text-anchor="middle" fill="#243c49">sum of site coordinates</text>
<text x="260" y="627" font-size="25" text-anchor="middle" fill="#243c49">At fixed depth k = 1</text>
<text x="260" y="672" font-size="24" text-anchor="middle" fill="#243c49">r &lt; 1: two components</text>
<circle cx="150" cy="704" r="8" fill="#287271" stroke="#287271" stroke-width="3"/>
<circle cx="370" cy="704" r="8" fill="#287271" stroke="#287271" stroke-width="3"/>
<text x="260" y="760" font-size="24" text-anchor="middle" fill="#243c49">r = 1: one component</text>
<line x1="150" y1="792" x2="370" y2="792" stroke="#287271" stroke-width="5"/>
<circle cx="150" cy="792" r="8" fill="#287271" stroke="#287271" stroke-width="3"/>
<circle cx="370" cy="792" r="8" fill="#287271" stroke="#287271" stroke-width="3"/>
<text x="260" y="857" font-size="23" text-anchor="middle" fill="#243c49">The horizontal section keeps</text>
<text x="260" y="890" font-size="23" text-anchor="middle" fill="#243c49">the joining edge at depth 1.</text>
