<svg xmlns="http://www.w3.org/2000/svg" width="560" height="760" viewBox="0 0 560 760" role="img" aria-labelledby="title desc">
<title id="title">The dimension stays one while the maps change</title>
<desc id="desc">A finite window of the module V on the whole real line. Its dimension is one at every parameter. Consecutive half-open interval summands start at zero, one, two and three, continuing in both directions. Filled left endpoints are included; open right endpoints are excluded. For s equal to one quarter and t equal to three quarters, both floor labels are zero, both spaces are k, and the structure matrix is [1]. For s equal to three quarters and t equal to one, the labels are zero and one, both spaces are k, and the structure matrix is [0]. The stalk at the integer one is nonzero because the next summand starts there.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#156b91" stroke-width="1.5"/></marker></defs>
<rect width="560" height="760" fill="white"/>
<g font-family="DejaVu Sans,sans-serif" fill="#173147" text-anchor="middle">
<text x="280" y="36" font-size="24">Same dimensions, different maps</text>
<text x="280" y="70" font-size="21">Coefficient field k = ℚ</text>
<text x="280" y="112" font-size="22">dim V(t) = 1</text>
<path d="M48 136H512" fill="none" stroke="#156b91" stroke-width="3"/>
<path d="M55 131L48 136L55 141M505 131L512 136L505 141" fill="none" stroke="#156b91" stroke-width="2"/>
<text x="280" y="181" font-size="21">The summand changes at each integer</text>
<g fill="none" stroke="#a5b8c5" stroke-dasharray="4 5"><path d="M85 196V307M215 196V307M345 196V307M475 196V307"/></g>
<g fill="none" stroke-width="5" stroke="#156b91"><path d="M85 220H215M345 220H475"/><path d="M35 265H85M475 265H525" stroke-dasharray="6 5"/></g>
<path d="M215 265H345" fill="none" stroke="#806230" stroke-width="5"/>
<g fill="#156b91" stroke="#156b91" stroke-width="2"><circle cx="85" cy="220" r="6"/><circle cx="345" cy="220" r="6"/><circle cx="475" cy="265" r="6"/><circle cx="215" cy="220" r="6" fill="white"/><circle cx="475" cy="220" r="6" fill="white"/><circle cx="85" cy="265" r="6" fill="white"/></g>
<circle cx="215" cy="265" r="6" fill="#806230"/><circle cx="345" cy="265" r="6" fill="white" stroke="#806230" stroke-width="2"/>
<g font-size="20"><text x="150" y="207">[0, 1)</text><text x="280" y="253">[1, 2)</text><text x="410" y="207">[2, 3)</text></g>
<path d="M45 310H520" fill="none" stroke="#64748b" stroke-width="1.5"/>
<g font-size="21"><text x="85" y="338">0</text><text x="215" y="338">1</text><text x="345" y="338">2</text><text x="475" y="338">3</text><text x="538" y="317">t</text></g>
<g fill="#f2f7fa" stroke="#bdced9"><rect x="25" y="362" width="510" height="152" rx="8"/><rect x="25" y="535" width="510" height="152" rx="8"/></g>
<g font-size="21"><text x="280" y="393">Inside one interval</text><text x="155" y="425">s = 1/4</text><text x="405" y="425">t = 3/4</text><text x="155" y="494">label 0</text><text x="405" y="494">label 0</text><text x="280" y="566">Across the endpoint at 1</text><text x="155" y="598">s = 3/4</text><text x="405" y="598">t = 1</text><text x="155" y="667">label 0</text><text x="405" y="667">label 1</text></g>
<g font-size="29"><text x="155" y="462">k</text><text x="405" y="462">k</text><text x="155" y="635">k</text><text x="405" y="635">k</text></g>
<g stroke="#156b91" fill="none" stroke-width="2" marker-end="url(#arrow)"><path d="M181 453H376"/><path d="M181 626H376"/></g>
<g font-size="21" fill="#156b91"><text x="280" y="447">[1]</text><text x="280" y="620">[0]</text></g>
<g font-size="20"><text x="280" y="719">A finite window is drawn here.</text><text x="280" y="747">The intervals continue in both directions.</text></g>
</g></svg>
