<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
  <title id="title">Constant dimensions with a new interval at every integer</title>
  <desc id="description">An authored schematic of a persistence module over the real line with coefficient field k equal to the rationals. Every stalk V of t is k. For s less than or equal to t, the map is the identity when the floors of s and t agree, and zero otherwise. The upper plot is the constant dimension function one. Below it, aligned to the same parameter axis, staggered bars show the half-open interval summands from zero to one, one to two, two to three, and three to four. Partial dashed bars and ellipses on both sides indicate the unit intervals continuing over all integers. Filled circles include each left endpoint; open circles exclude each right endpoint. At each integer the next summand starts, so the total stalk remains k. Two selected maps are shown below: from one quarter to three quarters the map k to k is the identity; from five halves to three it is zero, although both stalks are k. Thus identical dimensions at all parameters do not show the infinitely repeated changes in the structure maps.</desc>
  <defs>
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="map-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#0f766e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="620" fill="#ffffff"/>
  <g font-family="DejaVu Sans, sans-serif" fill="#172b42" text-anchor="middle">
    <text x="600" y="40" font-size="33">Constant dimensions, changing maps</text>
    <text x="600" y="82" font-size="26">dim V(t) = 1 for every t</text>
    <text x="1080" y="82" font-size="25" fill="#475569">k = ℚ</text>

    <!-- All rows use x = 160 + 220t. The dimension plot has height one at y=125. -->
    <g fill="none" stroke="#64748b" stroke-width="1.8">
      <path d="M 70 101 V 180"/>
      <path d="M 70 180 H 1130" marker-end="url(#axis-arrow)"/>
    </g>
    <path d="M 75 125 H 1120 M 85 119 L 75 125 L 85 131 M 1110 119 L 1120 125 L 1110 131" fill="none" stroke="#245c99" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="49" y="134" font-size="24" fill="#475569">1</text>
    <text x="1152" y="188" font-size="26" fill="#475569">t</text>
    <g fill="none" stroke="#64748b" stroke-width="1.5">
      <path d="M 160 175 V 185 M 380 175 V 185 M 600 175 V 185 M 820 175 V 185 M 1040 175 V 185"/>
    </g>
    <g font-size="24" fill="#475569">
      <text x="160" y="212">0</text>
      <text x="380" y="212">1</text>
      <text x="600" y="212">2</text>
      <text x="820" y="212">3</text>
      <text x="1040" y="212">4</text>
    </g>

    <text x="600" y="249" font-size="24">Unit-interval summands continue in both directions</text>
    <g fill="none" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 5">
      <path d="M 160 258 V 350 M 380 258 V 350 M 600 258 V 350 M 820 258 V 350 M 1040 258 V 350"/>
    </g>
    <!-- Staggering separates an excluded right endpoint from the next included left endpoint. -->
    <g fill="none" stroke="#245c99" stroke-width="6">
      <path d="M 160 285 H 380"/>
      <path d="M 600 285 H 820"/>
      <path d="M 1040 285 H 1130" stroke-dasharray="9 7"/>
    </g>
    <g fill="none" stroke="#0f766e" stroke-width="6">
      <path d="M 70 335 H 160" stroke-dasharray="9 7"/>
      <path d="M 380 335 H 600"/>
      <path d="M 820 335 H 1040"/>
    </g>
    <g fill="#245c99" stroke="#245c99" stroke-width="2.5">
      <circle cx="160" cy="285" r="7"/>
      <circle cx="600" cy="285" r="7"/>
      <circle cx="1040" cy="285" r="7"/>
      <circle cx="380" cy="285" r="7" fill="#ffffff"/>
      <circle cx="820" cy="285" r="7" fill="#ffffff"/>
    </g>
    <g fill="#0f766e" stroke="#0f766e" stroke-width="2.5">
      <circle cx="380" cy="335" r="7"/>
      <circle cx="820" cy="335" r="7"/>
      <circle cx="160" cy="335" r="7" fill="#ffffff"/>
      <circle cx="600" cy="335" r="7" fill="#ffffff"/>
      <circle cx="1040" cy="335" r="7" fill="#ffffff"/>
    </g>
    <g font-size="23">
      <text x="270" y="275" fill="#245c99">[0, 1)</text>
      <text x="490" y="324" fill="#0f766e">[1, 2)</text>
      <text x="710" y="275" fill="#245c99">[2, 3)</text>
      <text x="930" y="324" fill="#0f766e">[3, 4)</text>
    </g>
    <text x="42" y="342" font-size="33" fill="#0f766e">⋯</text>
    <text x="1158" y="292" font-size="33" fill="#245c99">⋯</text>

    <text x="600" y="389" font-size="24">Two structure maps, on the same t axis</text>
    <g fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#map-arrow)">
      <path d="M 237 440 H 301"/>
      <path d="M 732 440 H 796"/>
    </g>
    <g font-size="33">
      <text x="215" y="450">k</text>
      <text x="325" y="450">k</text>
      <text x="710" y="450">k</text>
      <text x="820" y="450">k</text>
    </g>
    <g font-size="24" fill="#145e59">
      <text x="270" y="428">id</text>
      <text x="765" y="428">0</text>
    </g>
    <g font-size="22" fill="#475569">
      <text x="215" y="482">s = 1/4</text>
      <text x="325" y="482">t = 3/4</text>
      <text x="710" y="482">s = 5/2</text>
      <text x="820" y="482">t = 3</text>
    </g>
    <text x="270" y="518" font-size="23">Same interval: identity</text>
    <text x="765" y="518" font-size="23">Crosses an integer: zero</text>

    <circle cx="233" cy="553" r="6" fill="#245c99" stroke="#245c99" stroke-width="2"/>
    <circle cx="643" cy="553" r="6" fill="#ffffff" stroke="#245c99" stroke-width="2"/>
    <g font-size="22" fill="#475569" text-anchor="start">
      <text x="253" y="561">Included left endpoint</text>
      <text x="663" y="561">Excluded right endpoint</text>
    </g>
    <text x="600" y="602" font-size="22">The next interval starts at each integer; every boundary stalk is still k.</text>
  </g>
</svg>
