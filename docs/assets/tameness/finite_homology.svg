<svg xmlns="http://www.w3.org/2000/svg" width="500" height="460" viewBox="0 0 500 460" role="img" aria-labelledby="title desc">
<title id="title">Taking homology commutes with pullback</title>
<desc id="desc">A commuting square. At the upper left is a chain complex C with differential d on a finite poset P; at the upper right is its pullback along pi to the original parameter poset Q, including its differential. Each downward arrow takes cycles modulo boundaries. The lower left is H_h(C), and the lower right is its pullback, isomorphic to H_h(pi*C). Both horizontal arrows are pullback along the same map pi.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#156b91" stroke-width="1.5"/></marker></defs>
<rect width="500" height="460" fill="white"/>
<g font-family="DejaVu Sans,sans-serif" fill="#173147" text-anchor="middle">
<text x="250" y="34" font-size="24">Recover the differentials too</text>
<text x="116" y="79" font-size="21">Finite poset P</text><text x="384" y="79" font-size="21">Parameters Q</text>
<g stroke="#a5becd" stroke-width="1.5" fill="#f0f6f9"><rect x="20" y="99" width="192" height="88" rx="8"/><rect x="288" y="99" width="192" height="88" rx="8"/><rect x="20" y="337" width="192" height="92" rx="8"/><rect x="288" y="337" width="192" height="92" rx="8"/></g>
<g font-size="25"><text x="116" y="135">C with d</text><text x="384" y="135">π*C with π*d</text><text x="116" y="374">H<tspan baseline-shift="sub" font-size="18">h</tspan>(C)</text><text x="384" y="374">π*H<tspan baseline-shift="sub" font-size="18">h</tspan>(C)</text><text x="250" y="126">π*</text><text x="250" y="374">π*</text></g>
<g font-size="20"><text x="116" y="166">chain complex</text><text x="384" y="166">chain complex</text><text x="116" y="254">cycles modulo</text><text x="116" y="280">boundaries</text><text x="384" y="254">cycles modulo</text><text x="384" y="280">boundaries</text><text x="116" y="406">homology on P</text><text x="384" y="406">homology on Q</text></g>
</g>
<g fill="none" stroke="#156b91" stroke-width="2" marker-end="url(#arrow)"><path d="M221 148H279"/><path d="M221 393H279"/><path d="M116 192V224"/><path d="M116 290V330"/><path d="M384 192V224"/><path d="M384 290V330"/></g>
</svg>
