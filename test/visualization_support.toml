date = "2026-10-15"
environment = "Julia 1.12.1, Makie 0.24.15, CairoMakie 0.15.15, WGLMakie 0.13.15, Bonito 5.2.0, Observables 0.5.5; Node 22.23.3, Playwright 1.63.0 and Chromium 153.0.8010.12 (revision 1243). One Julia/BLAS thread and one browser worker. A125's 12 October browser run used Chromium 155.0.8059.12 (revision 1247); the earlier recorded browser used revision 1243. A128 native checks used Julia 1.12.1 with two default threads; focused final core/regressions and the live fixture used Julia 1.12.7 -O0 with one default/BLAS thread. Its browser used Chromium revision 1243. A40/A55 native and live acceptance used a warmed Julia 1.12.1 process with normal compilation, optimization level 0 and one Julia/BLAS thread. Their separate fresh-process query measurements used normal compilation and optimization level 2."
native = "The earlier 29-owner qualification exercised: 23,860 assertions passed and 12 nested-app stylesheet assertions failed. After repair, a fresh focused run passed 251/251 embedding, style, coordinate, volume and WGL-export assertions. The later saved-HTML readability repair passed 103/103 export assertions in another fresh process. A99 subsequently passed 3,200 focused owner/API assertions with graphics loaded; its final field-label/export-control rendering run passed 14/14. A54 subsequently passed 545 focused checks, including 19 actual Cairo/WGL renderer/export assertions, and an extended 462-assertion boundary-oracle run. A44 subsequently passed 876 focused checks, including 43 native Cairo/WGL assertions. Its separate fresh mathematical regression run passed 1,158 and API guards passed 2,936. These overlapping counts are separate runs, not an aggregate total. On 12 October, A125 passed a fresh 158-assertion owner with Cairo/WGL required: exact endpoint maps and compositions over QQ/F2/F3, cycle/filling equations, incomparable and unavailable parameters, zero composites, multicritical superlevel order, a higher-cell filling, budgets, serialized coefficients, actual renderer axes, exports and native lifecycle. Separate source/API guards passed 3,077 checks; these counts overlap earlier runs and are not an aggregate. On 13 October, A128 passed 329 native owner assertions with Cairo/WGL required, then 308 final core assertions with five expected graphics skips after a caption/legend cleanup. Separate source/A92/A118/API guards passed 30,051 assertions with one graphics skip. These are overlapping runs, not an aggregate. A96 passed 699 mathematical/session assertions and 32 final native renderer/export assertions, including independent reductions at crossings and intermediate points, F2/F3/F5, both filtration orders, exact representatives, actual Cairo/WGL coordinates and close-during-update cleanup. Its owned-value codec regression passed 328 assertions and separate source/API guards passed 3,477. The 32-assertion final graphics run overlaps the earlier 27 graphics checks; these runs are not aggregate totals. A124 passed 243 final native assertions with Cairo/WGL loaded, including independent rectangle and codensity-boundary oracles, fresh construction parity over F2/F3, stable input history, active cancellation/closure, obsolete work rejection, actual renderer coordinates and exports. An earlier overlapping combined run passed 3,795 A124/API/shared-request assertions, including the repaired late-callback world-age boundary. A126 passed 6,648 combined owner/API assertions in a fresh Julia 1.12.1 -O1 process with Cairo and WGL required. Independent F2 reconstruction/basis/summand oracles, exact compression round trips, coordinate checks, preparation/display budgets, native lifecycle and actual PNG/SVG/PDF/HTML exports are included. This total includes shared API guards and is not additive with earlier runs. A127 passed 3,458 focused owner/API assertions in a fresh Julia 1.12.1 process with Cairo/WGL required. Independent curve/Betti, sum, basis-change, reversed-axis, equal-rank/different-curve, diagonal-sequence and integer-boundary oracles are included. After a visual label cleanup, 37 final native renderer/export assertions passed in the same process; these overlap the fresh run and are not additive. A130 passed 9,894 focused owner/API/source assertions, then a fresh 50-assertion final graphics/UI/export run after correcting static readout bounds and the redraw input guard. Both Cairo/WGL extensions were required; these overlapping counts are not additive. A40/A55 passed 4,205 combined focused assertions with both Cairo/WGL extensions required: 322 feature assertions, 102 retained-renderer regressions and 3,781 source/API guards. Tests include actual source cycles/death fillings, unique/nonunique/absent common-upper preimages, QQ and prime fields, multicritical translated-slice certificates, temporal chain inclusions and commuting squares, nonidentity-map/generalized-rank oracles, actual coordinates, native lifecycle and PNG/SVG/PDF/HTML exports. The final run includes hover followed by exact scale entry and cleanup, explicit retained panel layouts, unchanged temporal axes, heatmap/colorbar connection through annotation changes, a fixed nonnegative landscape color scale, and centered endpoint/landscape glyphs. Earlier caption/contrast reruns passed 161 A40 and 41 A55 assertions; these overlap the combined run and are not additive. A97 passed 41 focused native assertions: actual Cairo/WGL scenes, fixed cyclic color ranges, PNG/SVG/PDF exports, source-axis selection, exact lift metadata, retained updates and lifecycle cleanup. Its mathematical and spatial-alpha companion checks passed 290 assertions; focused existing regressions passed 4860."
live = "The earlier 27 standalone Chromium scenarios passed. Both additional A99 editor scenarios passed, including numeric edits, invalid relation recovery, downloads, linked-client cleanup and narrow keyboard scrolling. The strengthened composition-host keyboard scenario also passed against a fresh Julia server, including resize, pointer pan and unchanged correspondence geometry. Both A54 scenarios passed on the final browser run: finite selection, boundary occurrences/bars, matrix toggles, exact rational worm entry, verified pointer centers, layer reuse, linked-client cleanup and narrow keyboard scrolling. The A44 standalone Chromium scenario passed real sliders, native chart selection, plane/layer/baseline changes, invalid-input rollback, two-viewer synchronization with visible slider positions after reset, stale-error clearing, disconnect cleanup, narrow keyboard scrolling and close/release. A125 subsequently passed two standalone Chromium scenarios: exact and keyboard controls, entry and class selection, invalid-witness rollback, hover without queries, panel/source/target selection, shared views, disconnect cleanup, retained contact canvas, narrow keyboard scrolling, incomparable grid points and nonzero adjacent maps with zero composite. Rendered frames were inspected; the disconnect check allows Bonito's 30-second reconnection grace period. A128 passed its periodic incidence-cancellation scenario and its spatial brush/exact-input, computed maps/witnesses, rollback, linked-client, narrow keyboard-scroll and cleanup scenario. The latter passed on a warm rerun after its initial cold run exceeded the overall test budget; operation assertions were retained. Final visual review clarified witness captions/legends (checked in core) and cleared stale hover text on refresh; the recorded live scenarios precede those display-only edits. A96 passed both final standalone Chromium scenarios: exact crossings, pointer/keyboard selection, visible source representatives, invalid-input rollback, linked sliders, forward/backward playback, endpoint stopping, disconnect cleanup, narrow scrolling, duplicate/unmatched members, recorded objectives and close during playback. The latter exposed and now guards a repaired refresh/close race. The fixture first ran native graphics checks; the first browser update allows 120 seconds for compilation, with normal timeouts retained for later actions. No cold-start speed claim is made. A124 passed three final Chromium 155.0.8059.12 (1247) scenarios: pointer and keyboard source edits, explicit reconstruction, linked undo/redo/reset, settings and parameter changes, budget failure/recovery, cancellation/close, narrow scrolling, inactive sites and censored H0 bars. Hover feedback now reserves layout space so it cannot shift the dragged chart. A126 passed two final standalone Chromium scenarios: exact coefficient and full-bar/edge picking, read-only hover, linked clients, invalid-input recovery, reset, narrow keyboard scrolling, compression, terminal rows, rapid slider final-state correctness, retained canvas and listener cleanup. Final wide, compressed and narrow layouts were visually inspected. A127 passed both final standalone Chromium scenarios: exact point and curve inputs, pointer picking, read-only hover, Betti labels, linked-client synchronization and disconnect cleanup, invalid-input recovery, rapid sliders, retained canvas, zero module, narrow keyboard scrolling and close/listener cleanup. Wide, narrow and empty figures were visually inspected. A130 passed two final standalone Chromium scenarios: forward/reverse operations, real source/matrix/barcode picking, exact fillings, provisional/finalized prefix semantics, linked clients, invalid-input recovery, rapid slider final-state correctness during redraw, retained canvas, narrow keyboard scrolling, empty input and observer cleanup. Final wide and narrow frames were visually inspected. A40/A55 passed two full standalone Chromium workflows and two focused horizontal-scrolling scenarios. They cover exact source cycles/fillings and pinned common-upper correspondence, temporal source/arrow/barcode/landscape synchronization, real canvas coordinates and picking, read-only hover followed by exact scale entry, invalid-input rollback, linked clients, rapid slider final-state correctness, retained temporal axes and cleanup. Marked source-cycle and temporal containers preserve actual horizontal wheel scrolling as well as keyboard navigation. Three existing continuous/manual/certified-infinity slice scenarios also passed; earlier aggregate logs contain repaired A55 failures and are not counted as aggregate successes. Final wide, narrow and horizontally scrolled frames were visually inspected. A97 passed two final standalone Chromium scenarios with no retries: source/circle picking, read-only hover, class and phase selection, linked viewers, invalid-input rollback, rapid slider final-state correctness, retained figure, reset, close and disconnect cleanup. The latter allows Bonitos 30-second reconnect window. Wide and narrow frames, including the horizontally scrolled torus panel, were inspected; keyboard and actual horizontal wheel scrolling passed."
offline = "All 3 scenarios passed with Julia stopped and networking disabled: fixed SVG compositions, saved finite states, and an actually rendered WGL scene with reload. Narrow SVG views preserve their intrinsic size and support keyboard and pointer scrolling. A125 separately passed its contact/filling atlas scenario with its fixture Julia process stopped and networking disabled: saved selections, exact downloads, reload and narrow keyboard/pointer scrolling, with no HTTP/WebSocket requests or browser errors. A128 passed saved ring/empty selection, exact download, reload and narrow scrolling checks with its fixture stopped and networking disabled; no HTTP/WebSocket requests or browser errors. Its saved figure was visually inspected. A96 passed saved-state selection, exact value download, reload and narrow keyboard/pointer scrolling with its Julia fixture stopped and networking disabled. No HTTP/WebSocket requests or browser errors occurred. Live and offline screenshots were visually reviewed. A124 passed one saved-comparison scenario after its Julia fixture exited, with networking disabled: state selection, exact downloaded values, reload and narrow keyboard/pointer scrolling; zero HTTP/WebSocket requests and browser errors. Final live and offline figures were visually reviewed. A126 passed original/compressed saved-state selection, exact value download, reload and narrow keyboard/pointer scrolling after its producing Julia process exited, with networking disabled and no HTTP/WebSocket requests or browser errors. Wide and narrow saved figures were visually inspected. A127 passed saved birth/death selection, exact value download, reload and narrow keyboard/pointer scrolling after its producing Julia process exited, with networking disabled and no HTTP/WebSocket requests or browser errors. Wide and narrow figures were visually inspected. A130 passed saved-state selection, exact value download, reload and narrow keyboard/pointer scrolling with its producer exited and networking disabled; zero HTTP/WebSocket requests or browser errors. Final wide and narrow saved figures were visually inspected. A40/A55 passed two final saved-view scenarios after their producing Julia process exited normally, with Chromium networking disabled: stored selections, exact-value downloads, reload and narrow keyboard/pointer scrolling. No HTTP/WebSocket requests or browser errors occurred. Wide and narrow saved figures were visually inspected; earlier preflights with the producer alive are not used as independent offline evidence. A97 passed saved-state selection, exact coordinate-data download, reload and narrow keyboard/pointer scrolling after its producing Julia process exited, with networking disabled. No HTTP/WebSocket requests or browser errors occurred; wide and narrow saved figures were visually inspected."


