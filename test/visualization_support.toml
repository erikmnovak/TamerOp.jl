[verification]
date = "2026-10-12"
environment = "Julia 1.12.1, Makie 0.24.15, CairoMakie 0.15.15, WGLMakie 0.13.15, Bonito 5.2.0, Observables 0.5.5; Node 22.23.3, Playwright 1.63.0 and Chromium 153.0.8010.12 (revision 1243). One Julia/BLAS thread and one browser worker. A125's 12 October browser run used Chromium 155.0.8059.12 (revision 1247); the earlier recorded browser used revision 1243."
native = "The earlier 29-owner qualification exercised: 23,860 assertions passed and 12 nested-app stylesheet assertions failed. After repair, a fresh focused run passed 251/251 embedding, style, coordinate, volume and WGL-export assertions. The later saved-HTML readability repair passed 103/103 export assertions in another fresh process. A99 subsequently passed 3,200 focused owner/API assertions with graphics loaded; its final field-label/export-control rendering run passed 14/14. A54 subsequently passed 545 focused checks, including 19 actual Cairo/WGL renderer/export assertions, and an extended 462-assertion boundary-oracle run. A44 subsequently passed 876 focused checks, including 43 native Cairo/WGL assertions. Its separate fresh mathematical regression run passed 1,158 and API guards passed 2,936. These overlapping counts are separate runs, not an aggregate total. On 12 October, A125 passed a fresh 158-assertion owner with Cairo/WGL required: exact endpoint maps and compositions over QQ/F2/F3, cycle/filling equations, incomparable and unavailable parameters, zero composites, multicritical superlevel order, a higher-cell filling, budgets, serialized coefficients, actual renderer axes, exports and native lifecycle. Separate source/API guards passed 3,077 checks; these counts overlap earlier runs and are not an aggregate."
live = "The earlier 27 standalone Chromium scenarios passed. Both additional A99 editor scenarios passed, including numeric edits, invalid relation recovery, downloads, linked-client cleanup and narrow keyboard scrolling. The strengthened composition-host keyboard scenario also passed against a fresh Julia server, including resize, pointer pan and unchanged correspondence geometry. Both A54 scenarios passed on the final browser run: finite selection, boundary occurrences/bars, matrix toggles, exact rational worm entry, verified pointer centers, layer reuse, linked-client cleanup and narrow keyboard scrolling. The A44 standalone Chromium scenario passed real sliders, native chart selection, plane/layer/baseline changes, invalid-input rollback, two-viewer synchronization with visible slider positions after reset, stale-error clearing, disconnect cleanup, narrow keyboard scrolling and close/release. A125 subsequently passed two standalone Chromium scenarios: exact and keyboard controls, entry and class selection, invalid-witness rollback, hover without queries, panel/source/target selection, shared views, disconnect cleanup, retained contact canvas, narrow keyboard scrolling, incomparable grid points and nonzero adjacent maps with zero composite. Rendered frames were inspected; the disconnect check allows Bonito's 30-second reconnection grace period."
offline = "All 3 scenarios passed with Julia stopped and networking disabled: fixed SVG compositions, saved finite states, and an actually rendered WGL scene with reload. Narrow SVG views preserve their intrinsic size and support keyboard and pointer scrolling. A125 separately passed its contact/filling atlas scenario with its fixture Julia process stopped and networking disabled: saved selections, exact downloads, reload and narrow keyboard/pointer scrolling, with no HTTP/WebSocket requests or browser errors."

